<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="520" height="100">
  <defs>
    <!-- Background: transparent -->

    <!-- Green-to-orange gradient for the diamond icon -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2ECC71"/>
      <stop offset="50%"  stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>

    <!-- Text gradient: charcoal with slight sheen -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3D3D3D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>

    <!-- Subtle glow filter for icon -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow for text -->
    <filter id="textShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000018"/>
    </filter>
  </defs>

  <!-- ── ICON: nested diamonds (finance/crypto aesthetic) ── -->
  <g transform="translate(18, 50)" filter="url(#glow)">
    <!-- Outer diamond -->
    <polygon points="38,0 76,38 38,76 0,38"
      fill="none" stroke="url(#iconGrad)" stroke-width="3.5"
      opacity="0.35" transform="translate(-38,-38)"/>

    <!-- Mid diamond rotated 45° -->
    <polygon points="27,0 54,27 27,54 0,27"
      fill="none" stroke="url(#iconGrad)" stroke-width="3"
      opacity="0.6" transform="translate(-27,-27) rotate(22.5,27,27)"/>

    <!-- Inner solid diamond -->
    <polygon points="17,0 34,17 17,34 0,17"
      fill="url(#iconGrad)"
      transform="translate(-17,-17)"/>

    <!-- Tiny center dot -->
    <circle cx="0" cy="0" r="3.5" fill="#fff" opacity="0.9"/>

    <!-- Circuit-trace lines emanating -->
    <line x1="38" y1="0" x2="55" y2="0"  stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="-38" y1="0" x2="-55" y2="0" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="38" x2="0" y2="55"  stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-38" x2="0" y2="-55" stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>

    <!-- Corner dots -->
    <circle cx="55"  cy="0"  r="2.5" fill="#2ECC71" opacity="0.7"/>
    <circle cx="-55" cy="0"  r="2.5" fill="#E74C3C" opacity="0.7"/>
    <circle cx="0"   cy="55" r="2.5" fill="#F39C12" opacity="0.7"/>
    <circle cx="0"  cy="-55" r="2.5" fill="#2ECC71" opacity="0.7"/>
  </g>

  <!-- ── TEXT: Shivam ── -->
  <text
    x="98" y="56"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="52"
    font-weight="700"
    letter-spacing="-1"
    fill="url(#textGrad)"
    filter="url(#textShadow)"
  >Shivam</text>

  <!-- ── ICON between words: small rupee/finance symbol ── -->
  <g transform="translate(290, 50)">
    <!-- Hexagon -->
    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7"
      fill="none" stroke="url(#iconGrad)" stroke-width="2.2"/>
    <!-- ₹ symbol inside -->
    <text x="0" y="6" text-anchor="middle"
      font-family="'Georgia',serif" font-size="14" font-weight="700"
      fill="url(#iconGrad)">₹</text>
  </g>

  <!-- ── TEXT: Sharma ── -->
  <text
    x="312" y="56"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="52"
    font-weight="700"
    letter-spacing="-1"
    fill="url(#textGrad)"
    filter="url(#textShadow)"
  >Sharma</text>

  <!-- ── Tagline ── -->
  <text
    x="98" y="76"
    font-family="'Georgia', serif"
    font-size="11"
    font-weight="400"
    letter-spacing="4"
    fill="#888888"
  >PERSONAL FINANCE TRACKER</text>

  <!-- ── Bottom accent line ── -->
  <line x1="98" y1="83" x2="510" y2="83"
    stroke="url(#iconGrad)" stroke-width="1.5" opacity="0.4"/>
</svg>
